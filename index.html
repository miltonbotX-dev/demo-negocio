<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bodega Doña Rosa (ejemplo)</title>
<meta name="description" content="Página de ejemplo para negocios de barrio">
<script>
/* =========================================================
   DATOS DEL NEGOCIO: cambia solo esto para cada cliente
   ========================================================= */
const NEGOCIO = {
  nombre: "Bodega Doña Rosa",
  eslogan: "Tu bodega de confianza en el barrio",
  emoji: "🛒",                    // ícono del negocio
  foto: "",                       // URL de una foto propia del cliente (si queda vacío se usa el diseño con degradado)
  colorPrincipal: "#b5452c",
  colorSecundario: "#f2b33d",
  whatsapp: "51999999999",        // con código de país 51, sin + ni espacios
  mensajeWhatsapp: "Hola, vi su página y quiero hacer un pedido",
  direccion: "Av. Ejemplo 123, Lima",
  mapaEmbed: "",                  // pega aquí el link "Insertar mapa" de Google Maps (src del iframe)
  mapaLink: "https://maps.google.com/?q=Lima",
  horario: [
    ["Lunes a viernes", "7:00 a.m. - 10:00 p.m."],
    ["Sábado", "7:00 a.m. - 11:00 p.m."],
    ["Domingo", "8:00 a.m. - 2:00 p.m."]
  ],
  productos: [
    { emoji: "🍞", nombre: "Pan francés (unidad)", precio: "S/ 0.30" },
    { emoji: "🥚", nombre: "Huevos (kilo)", precio: "S/ 8.50" },
    { emoji: "🥛", nombre: "Leche evaporada", precio: "S/ 4.20" },
    { emoji: "🍚", nombre: "Arroz (kilo)", precio: "S/ 4.80" },
    { emoji: "🧃", nombre: "Gaseosa 1.5 L", precio: "S/ 6.00" },
    { emoji: "🛵", nombre: "Delivery en el barrio", precio: "Gratis desde S/ 30" }
  ],
  redes: {
    facebook: "https://facebook.com/",
    instagram: "https://instagram.com/",
    tiktok: "https://tiktok.com/"
  },
  esEjemplo: true                 // ponlo en false cuando sea un negocio real
};
</script>
<style>
:root{--c1:#b5452c;--c2:#f2b33d;--tx:#2b2220;--bg:#fffaf4;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:var(--bg);line-height:1.5}
a{color:inherit}
.demo{background:#2b2220;color:#fff;text-align:center;font-size:.8rem;padding:.4rem 1rem}
.hero{position:relative;min-height:min(78vh,620px);display:flex;flex-direction:column;justify-content:flex-end;padding:2rem 1.25rem 2.5rem;color:#fff;
  background:radial-gradient(circle at 80% 15%,var(--c2) 0,transparent 45%),linear-gradient(160deg,var(--c1),#5a1f12);overflow:hidden}
.hero.foto{background-size:cover;background-position:center}
.hero.foto::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.75),rgba(0,0,0,.1))}
.hero>*{position:relative}
.hero .ico{font-size:4.5rem;line-height:1;margin-bottom:1rem;filter:drop-shadow(0 6px 12px rgba(0,0,0,.3))}
.hero h1{font-size:clamp(2.1rem,8vw,3.6rem);line-height:1.05;letter-spacing:-.02em}
.hero p{font-size:1.1rem;opacity:.92;margin:.6rem 0 1.4rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;background:#25d366;color:#fff;text-decoration:none;font-weight:700;
  font-size:1.1rem;padding:1rem 1.4rem;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.btn svg{width:24px;height:24px;fill:#fff}
section{padding:2.5rem 1.25rem;max-width:760px;margin:auto}
h2{font-size:1.5rem;margin-bottom:1rem}
h2::after{content:"";display:block;width:48px;height:4px;border-radius:4px;background:var(--c2);margin-top:.4rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.8rem}
.item{background:var(--card);border-radius:16px;padding:1rem;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.item .e{font-size:2rem}
.item .n{font-weight:600;margin:.3rem 0}
.item .p{color:var(--c1);font-weight:800}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06)}
td{padding:.8rem 1rem;border-bottom:1px solid #f0e6dc}
td:last-child{text-align:right;font-weight:600}
.map{border-radius:16px;overflow:hidden;background:repeating-linear-gradient(45deg,#f3e9de,#f3e9de 12px,#efe2d3 12px,#efe2d3 24px);
  min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center;padding:1rem}
.map iframe{width:100%;height:280px;border:0}
.redes{display:flex;gap:.8rem;flex-wrap:wrap}
.redes a{flex:1;min-width:110px;text-align:center;text-decoration:none;background:var(--card);border-radius:12px;padding:.8rem;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.06)}
footer{text-align:center;padding:2rem 1rem 6rem;font-size:.85rem;opacity:.75}
.flot{position:fixed;right:16px;bottom:16px;width:62px;height:62px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:9}
.flot svg{width:34px;height:34px;fill:#fff}
</style>
</head>
<body>
<div class="demo" id="demo">Página de ejemplo: negocio y datos ficticios</div>
<header class="hero" id="hero">
  <div class="ico" id="ico"></div>
  <h1 id="nombre"></h1>
  <p id="eslogan"></p>
  <div><a class="btn" id="wa1" target="_blank" rel="noopener"></a></div>
</header>
<section><h2>Productos y precios</h2><div class="grid" id="productos"></div></section>
<section><h2>Horario</h2><table id="horario"></table></section>
<section><h2>Ubícanos</h2><p id="dir" style="margin-bottom:.8rem"></p><div class="map" id="mapa"></div></section>
<section><h2>Síguenos</h2><div class="redes" id="redes"></div></section>
<footer id="footer"></footer>
<a class="flot" id="wa2" target="_blank" rel="noopener" aria-label="WhatsApp"></a>
<script>
const WA='<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.5-.3z"/></svg>';
const N=NEGOCIO,$=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.documentElement.style.setProperty('--c1',N.colorPrincipal);
document.documentElement.style.setProperty('--c2',N.colorSecundario);
document.title=N.nombre+(N.esEjemplo?' (ejemplo)':'');
if(!N.esEjemplo)$('demo').remove();
if(N.foto){$('hero').classList.add('foto');$('hero').style.backgroundImage='url("'+N.foto+'")'}
$('ico').textContent=N.emoji;$('nombre').textContent=N.nombre;$('eslogan').textContent=N.eslogan;
const wa='https://wa.me/'+N.whatsapp+'?text='+encodeURIComponent(N.mensajeWhatsapp);
$('wa1').href=$('wa2').href=wa;$('wa1').innerHTML=WA+' Pedir por WhatsApp';$('wa2').innerHTML=WA;
$('productos').innerHTML=N.productos.map(p=>`<div class="item"><div class="e">${esc(p.emoji)}</div><div class="n">${esc(p.nombre)}</div><div class="p">${esc(p.precio)}</div></div>`).join('');
$('horario').innerHTML=N.horario.map(h=>`<tr><td>${esc(h[0])}</td><td>${esc(h[1])}</td></tr>`).join('');
$('dir').innerHTML=`📍 ${esc(N.direccion)} · <a href="${esc(N.mapaLink)}" target="_blank" rel="noopener">Abrir en Google Maps</a>`;
$('mapa').innerHTML=N.mapaEmbed?`<iframe src="${esc(N.mapaEmbed)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Mapa"></iframe>`:'<div>🗺️<br><b>Aquí va el mapa de Google Maps</b><br><small>Se agrega con la ubicación del negocio</small></div>';
const R={facebook:'📘 Facebook',instagram:'📸 Instagram',tiktok:'🎵 TikTok'};
$('redes').innerHTML=Object.entries(N.redes).filter(([,u])=>u).map(([k,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${R[k]||k}</a>`).join('');
$('footer').innerHTML=`© ${new Date().getFullYear()} ${esc(N.nombre)}<br>${N.esEjemplo?'Negocio de ejemplo. Los precios y datos son ficticios.':''}`;
</script>
</body>
</html>
